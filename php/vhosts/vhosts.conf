<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/app/application
    DirectoryIndex /index.php

    <Directory /var/www/app/application>
        AllowOverride None
        Order Allow,Deny
        Allow from All

        FallbackResource /index.php
    </Directory>

    # uncomment the following lines if you install assets as symlinks
    # or run into problems when compiling LESS/Sass/CoffeeScript assets
    # <Directory /var/www/project>
    #     Options FollowSymlinks
    # </Directory>

    # ============================================================ # ASSETS # ============================================================ # 
    # Les fichiers statiques doivent être servis directement # par Apache. # 
    # Si un fichier CSS/JS/image n'existe pas, Apache doit # retourner 404 au lieu d'afficher la page d'accueil. # 
    # ============================================================ 
    <Directory /var/www/app/application/www> 
        FallbackResource disabled 
        Options FollowSymLinks 
        AllowOverride None 
        Order Allow,Deny 
        Allow from All 
    </Directory>

    # optionally disable the fallback resource for the asset directories
    # which will allow Apache to return a 404 error when files are
    # not found instead of passing the request to Symfony
    <Directory /var/www/app/application/bundles>
        FallbackResource disabled
    </Directory>
    ErrorLog /var/log/apache2/app_error.log
    CustomLog /var/log/apache2/app_access.log combined

    # optionally set the value of the environment variables used in the application
    #SetEnv APP_ENV prod
    #SetEnv APP_SECRET <app-secret-id>
    #SetEnv DATABASE_URL "mysql://db_user:db_pass@host:3306/db_name"

    # Important : il faut mettre cette commande pour les utilisateurs d'Apache, 
    # afin d'utiliser les tokens dans postman par exemple
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>
